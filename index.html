<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وَتيرة</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #eef8ff;
  color: #17324d;
}

header {
  background: linear-gradient(135deg, #5bbcf6, #8ed8ff);
  color: white;
  padding: 25px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 38px;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 800px;
  margin: 25px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin: 12px 0 7px;
  font-weight: bold;
}

select,
input {
  width: 100%;
  padding: 13px;
  border: 2px solid #d7edf9;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 18px;
  cursor: pointer;
  font-size: 16px;
  margin-top: 15px;
}

.primary {
  background: #55b9f3;
  color: white;
  width: 100%;
}

.secondary {
  background: #e7f6ff;
  color: #1976a8;
}

.danger {
  background: #ffe7e7;
  color: #c0392b;
}

.hidden {
  display: none;
}

.day {
  border: 2px solid #e0f2fc;
  border-radius: 16px;
  padding: 15px;
  margin-top: 15px;
}

.day h3 {
  margin-top: 0;
  color: #2388bd;
}

.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: #f7fcff;
  border-radius: 10px;
  margin: 8px 0;
}

.task input {
  width: auto;
}

.done {
  text-decoration: line-through;
  opacity: 0.5;
}

.progress-container {
  background: #e5f4fc;
  border-radius: 20px;
  overflow: hidden;
  height: 18px;
  margin-top: 12px;
}

.progress {
  background: #55b9f3;
  height: 100%;
  width: 0%;
  transition: 0.3s;
}

.message {
  background: #eef9ff;
  border-radius: 12px;
  padding: 12px;
  margin-top: 15px;
  text-align: center;
}

.timer {
  text-align: center;
}

.timer-number {
  font-size: 55px;
  font-weight: bold;
  color: #2388bd;
  margin: 10px;
}
</style>
</head>

<body>

<header>
  <h1>وَتيرة 💙</h1>
  <p>خطتك الدراسية تتنظم معك، حتى لو تأخرتِ.</p>
</header>

<div class="container">

  <div class="card">
    <h2>✨ أنشئي خطتك</h2>

    <label>اختاري المادة</label>

    <select id="subject" onchange="checkOtherSubject()">
      <option value="">اختاري المادة</option>
      <option value="رياضيات">رياضيات</option>
      <option value="كيمياء">كيمياء</option>
      <option value="فيزياء">فيزياء</option>
      <option value="أحياء">أحياء</option>
      <option value="قدرات">قدرات</option>
      <option value="تحصيلي">تحصيلي</option>
      <option value="other">مادة أخرى</option>
    </select>

    <div id="otherSubjectBox" class="hidden">
      <label>اكتبي اسم المادة</label>
      <input id="otherSubject" type="text" placeholder="مثال: لغتي">
    </div>

    <label>كم يوم تبغين تدرسين؟</label>
    <input id="days" type="number" min="1" max="30" placeholder="مثال: 7">

    <button class="primary" onclick="createPlan()">
      ✨ أنشئ لي خطة
    </button>

    <div id="message"></div>
  </div>


  <div class="card" id="planCard">
    <h2>📚 خطتي الدراسية</h2>

    <div>
      <strong>نسبة الإنجاز</strong>
      <div class="progress-container">
        <div class="progress" id="progress"></div>
      </div>
      <p id="progressText">0%</p>
    </div>

    <div id="plan"></div>

    <button class="secondary" onclick="lateDay()">
      🔄 تأخرت اليوم
    </button>

    <button class="danger" onclick="clearPlan()">
      🗑️ حذف الخطة
    </button>
  </div>


  <div class="card timer">
    <h2>⏱️ مؤقت المذاكرة</h2>

    <div class="timer-number" id="timer">25:00</div>

    <button class="primary" onclick="startTimer()">
      ▶️ ابدأ
    </button>

    <button class="secondary" onclick="pauseTimer()">
      ⏸️ إيقاف
    </button>

    <button class="danger" onclick="resetTimer()">
      🔄 إعادة
    </button>
  </div>

</div>


<script>

const taskTemplates = {

  "رياضيات": [
    "فهم الدرس",
    "مراجعة القوانين",
    "حل أمثلة الدرس",
    "حل تمارين متنوعة",
    "مراجعة الأخطاء",
    "اختبار قصير"
  ],

  "كيمياء": [
    "قراءة الدرس وفهم المفاهيم",
    "مراجعة المصطلحات والقوانين",
    "حل الأمثلة",
    "حل أسئلة نهاية الدرس",
    "مراجعة النقاط الصعبة",
    "اختبار قصير"
  ],

  "فيزياء": [
    "فهم المفاهيم الأساسية",
    "مراجعة القوانين والوحدات",
    "حل الأمثلة",
    "حل مسائل متنوعة",
    "مراجعة الأخطاء",
    "اختبار قصير"
  ],

  "أحياء": [
    "قراءة الدرس وفهمه",
    "مراجعة المصطلحات",
    "تلخيص الأفكار الأساسية",
    "مراجعة الرسومات والمفاهيم",
    "حل الأسئلة",
    "اختبار قصير"
  ],

  "قدرات": [
    "مراجعة المهارات الأساسية",
    "تدريب كمي",
    "تدريب لفظي",
    "حل مجموعة أسئلة",
    "مراجعة الأخطاء",
    "تدريب زمني"
  ],

  "تحصيلي": [
    "مراجعة المفاهيم",
    "تدريب على الأسئلة",
    "مراجعة القوانين",
    "حل أسئلة متنوعة",
    "مراجعة الأخطاء",
    "اختبار تجريبي"
  ],

  "default": [
    "قراءة الدرس وفهمه",
    "تحديد الأفكار المهمة",
    "مراجعة المعلومات",
    "حل التدريبات",
    "مراجعة الأخطاء",
    "مراجعة نهائية"
  ]
};


let plan = JSON.parse(localStorage.getItem("wateeraPlan")) || null;


function checkOtherSubject() {

  const subject = document.getElementById("subject").value;
  const box = document.getElementById("otherSubjectBox");

  if (subject === "other") {
    box.classList.remove("hidden");
  } else {
    box.classList.add("hidden");
  }
}


function createPlan() {

  let subject = document.getElementById("subject").value;
  const days = Number(document.getElementById("days").value);

  if (!subject) {
    showMessage("اختاري المادة أولًا 💙");
    return;
  }

  if (subject === "other") {

    subject = document.getElementById("otherSubject").value.trim();

    if (!subject) {
      showMessage("اكتبي اسم المادة 💙");
      return;
    }
  }

  if (!days || days < 1) {
    showMessage("اكتبي عدد الأيام 💙");
    return;
  }

  const tasks = taskTemplates[subject] || taskTemplates["default"];

  plan = {
    subject: subject,
    days: []
  };

  for (let i = 0; i < days; i++) {

    const task = tasks[i % tasks.length];

    plan.days.push({
      day: i + 1,
      tasks: [
        {
          text: task,
          done: false
        }
      ]
    });
  }

  savePlan();
  renderPlan();

  showMessage(
    `تم إنشاء خطة مادة <strong>${subject}</strong> لمدة <strong>${days}</strong> أيام ✨`
  );
}


function renderPlan() {

  const planDiv = document.getElementById("plan");

  if (!plan) {
    planDiv.innerHTML = `
      <div class="message">
        ما عندك خطة حاليًا. أنشئي خطتك من الأعلى ✨
      </div>
    `;

    updateProgress();
    return;
  }

  let html = `<h3>المادة: ${plan.subject}</h3>`;

  plan.days.forEach((day, dayIndex) => {

    html += `
      <div class="day">
        <h3>اليوم ${day.day}</h3>
    `;

    day.tasks.forEach((task, taskIndex) => {

      html += `
        <div class="task">
          <input
            type="checkbox"
            ${task.done ? "checked" : ""}
            onchange="toggleTask(${dayIndex}, ${taskIndex})"
          >

          <span class="${task.done ? "done" : ""}">
            ${task.text}
          </span>
        </div>
      `;
    });

    html += `</div>`;
  });

  planDiv.innerHTML = html;

  updateProgress();
}


function toggleTask(dayIndex, taskIndex) {

  plan.days[dayIndex].tasks[taskIndex].done =
    !plan.days[dayIndex].tasks[taskIndex].done;

  savePlan();
  renderPlan();
}


function updateProgress() {

  if (!plan) {
    document.getElementById("progress").style.width = "0%";
    document.getElementById("progressText").innerText = "0%";
    return;
  }

  let total = 0;
  let completed = 0;

  plan.days.forEach(day => {

    day.tasks.forEach(task => {

      total++;

      if (task.done) {
        completed++;
      }
    });
  });

  const percent =
    total === 0 ? 0 : Math.round((completed / total) * 100);

  document.getElementById("progress").style.width =
    percent + "%";

  document.getElementById("progressText").innerText =
    percent + "%";
}


function lateDay() {

  if (!plan) {
    showMessage("أنشئي خطة أولًا 💙");
    return;
  }

  let unfinished = [];

  plan.days.forEach(day => {

    day.tasks.forEach(task => {

      if (!task.done) {
        unfinished.push(task);
      }
    });
  });

  if (unfinished.length === 0) {
    showMessage("ما عندك مهام متأخرة 🎉");
    return;
  }

  const daysCount = plan.days.length;

  plan.days.forEach(day => {
    day.tasks = [];
  });

  unfinished.forEach((task, index) => {

    const dayIndex = index % daysCount;

    plan.days[dayIndex].tasks.push({
      text: task.text,
      done: false
    });
  });

  savePlan();
  renderPlan();

  showMessage(
    "تمت إعادة توزيع المهام غير المكتملة 🔄✨"
  );
}


function savePlan() {

  localStorage.setItem(
    "wateeraPlan",
    JSON.stringify(plan)
  );
}


function clearPlan() {

  if (confirm("متأكدة تبغين تحذفين الخطة؟")) {

    plan = null;

    localStorage.removeItem("wateeraPlan");

    renderPlan();

    showMessage("تم حذف الخطة 🗑️");
  }
}


function showMessage(text) {

  document.getElementById("message").innerHTML =
    `<div class="message">${text}</div>`;
}


/* المؤقت */

let timerSeconds = 25 * 60;
let timerInterval = null;


function updateTimerDisplay() {

  const minutes =
    Math.floor(timerSeconds / 60);

  const seconds =
    timerSeconds % 60;

  document.getElementById("timer").innerText =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}


function startTimer() {

  if (timerInterval) return;

  timerInterval = setInterval(() => {

    if (timerSeconds > 0) {

      timerSeconds--;

      updateTimerDisplay();

    } else {

      clearInterval(timerInterval);
      timerInterval = null;

      alert("خلص وقت المذاكرة! 🎉");
    }

  }, 1000);
}


function pauseTimer() {

  clearInterval(timerInterval);
  timerInterval = null;
}


function resetTimer() {

  clearInterval(timerInterval);
  timerInterval = null;

  timerSeconds = 25 * 60;

  updateTimerDisplay();
}


/* تشغيل الخطة المحفوظة عند فتح الموقع */

renderPlan();
updateTimerDisplay();

</script>

</body>
</html>
