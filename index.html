<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وَتيرة</title>

<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}

body{
  margin:0;
  background:#f4fbff;
  color:#17324d
}

header{
  background:linear-gradient(135deg,#b9e8ff,#edfaff);
  text-align:center;
  padding:38px 20px
}

.logo{
  font-size:50px;
  margin:0;
  font-weight:bold
}

.subtitle{
  color:#55798d;
  font-size:18px
}

.container{
  max-width:900px;
  margin:auto;
  padding:22px
}

.card{
  background:white;
  border-radius:22px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 7px 25px rgba(30,120,160,.1)
}

h2{margin-top:0}

select,input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:2px solid #d9f2ff;
  border-radius:13px;
  font-size:16px;
  background:white
}

button{
  border:0;
  border-radius:13px;
  padding:12px 18px;
  margin:6px 3px;
  background:#59bce7;
  color:white;
  font-size:16px;
  cursor:pointer
}

button:hover{background:#3fa9d8}

.secondary{
  background:#e6f7fd;
  color:#247a9d
}

.warning{
  background:#fff1d9;
  color:#96661d
}

.day{
  background:#f7fcff;
  border:1px solid #def2fa;
  border-radius:17px;
  padding:17px;
  margin:12px 0
}

.day-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px
}

.task{
  background:white;
  padding:13px;
  border-radius:12px;
  margin:8px 0;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #e8f5fa
}

.task button{
  margin-right:auto;
  font-size:13px;
  padding:8px 12px
}

.task.done span{
  text-decoration:line-through;
  opacity:.5
}

.progress{
  height:18px;
  background:#e5f5fb;
  border-radius:20px;
  overflow:hidden;
  margin-top:15px
}

.progress-bar{
  width:0%;
  height:100%;
  background:#59bce7;
  transition:.4s
}

.message{
  display:none;
  margin-top:12px;
  padding:13px;
  border-radius:13px;
  background:#e8f8ef;
  color:#267348
}

#timer{
  text-align:center;
  font-size:48px;
  margin:15px
}

.empty{
  text-align:center;
  color:#7894a3;
  padding:20px
}

footer{
  text-align:center;
  padding:30px;
  color:#7894a3
}
</style>
</head>

<body>

<header>
  <h1 class="logo">وَتيرة</h1>
  <p class="subtitle">نرتّب وقتك، ونرجّعك لمسارك ✨</p>
</header>

<div class="container">

  <div class="card">
    <h2>📚 أنشئي خطتك</h2>

    <select id="subject">
      <option value="">اختاري المادة</option>
      <option value="رياضيات">رياضيات</option>
      <option value="كيمياء">كيمياء</option>
      <option value="فيزياء">فيزياء</option>
      <option value="أحياء">أحياء</option>
      <option value="قدرات">قدرات</option>
      <option value="تحصيلي">تحصيلي</option>
    </select>

    <input
      id="days"
      type="number"
      min="1"
      max="30"
      placeholder="كم يوم عندك؟"
    >

    <button onclick="createPlan()">✨ أنشئ لي خطة</button>

    <div id="message" class="message"></div>
  </div>


  <div class="card">
    <h2>📅 خطتك الدراسية</h2>

    <div id="plan" class="empty">
      اختاري المادة وعدد الأيام، ووَتيرة ترتبها لك 💙
    </div>

    <button onclick="lateDay()" class="warning">
      🔄 تأخرت اليوم
    </button>

    <button onclick="clearPlan()" class="secondary">
      🗑️ حذف الخطة
    </button>
  </div>


  <div class="card">
    <h2>📊 تقدّمك</h2>

    <p id="progressText">لا توجد خطة حاليًا.</p>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>


  <div class="card">
    <h2>⏰ مؤقت المذاكرة</h2>

    <div id="timer">25:00</div>

    <div style="text-align:center">
      <button onclick="startTimer()">ابدأ</button>
      <button onclick="pauseTimer()" class="secondary">إيقاف</button>
      <button onclick="resetTimer()" class="secondary">إعادة</button>
    </div>
  </div>

</div>

<footer>
  وَتيرة 💙<br>
  لأن التأخير ما يعني النهاية.
</footer>


<script>

const taskTemplates = {

  "رياضيات":[
    "فهم الدرس",
    "مراجعة القوانين",
    "حل أمثلة الدرس",
    "حل تمارين متنوعة",
    "مراجعة الأخطاء",
    "اختبار قصير"
  ],

  "كيمياء":[
    "قراءة الدرس وفهم المفاهيم",
    "مراجعة المصطلحات والقوانين",
    "حل الأمثلة",
    "حل أسئلة نهاية الدرس",
    "مراجعة النقاط الصعبة",
    "اختبار قصير"
  ],

  "فيزياء":[
    "فهم المفاهيم الأساسية",
    "مراجعة القوانين والوحدات",
    "حل الأمثلة",
    "حل مسائل متنوعة",
    "مراجعة الأخطاء",
    "اختبار قصير"
  ],

  "أحياء":[
    "قراءة الدرس وفهمه",
    "مراجعة المصطلحات",
    "تلخيص الأفكار الأساسية",
    "مراجعة الرسومات والمفاهيم",
    "حل الأسئلة",
    "اختبار قصير"
  ],

  "قدرات":[
    "مراجعة المهارات الأساسية",
    "تدريب كمي",
    "تدريب لفظي",
    "حل مجموعة أسئلة",
    "مراجعة الأخطاء",
    "تدريب زمني"
  ],

  "تحصيلي":[
    "مراجعة المفاهيم",
    "تدريب على الأسئلة",
    "مراجعة القوانين",
    "حل أسئلة متنوعة",
    "مراجعة الأخطاء",
    "اختبار تجريبي"
  ]

};


let planData =
  JSON.parse(localStorage.getItem("wateeraPlan")) || [];

let timerSeconds = 25 * 60;
let timerInterval = null;


/* إنشاء الخطة */

function createPlan(){

  const subject =
    document.getElementById("subject").value;

  const days =
    Number(document.getElementById("days").value);

  if(!subject || !days){

    alert("اختاري المادة وعدد الأيام أولًا 💙");
    return;
  }


  const templates =
    taskTemplates[subject];


  planData=[];


  for(let i=1;i<=days;i++){

    planData.push({
      day:i,
      tasks:[]
    });

  }


  /*
    نوزع مراحل المادة على الأيام
  */

  for(let i=0;i<days;i++){

    const task =
      templates[i % templates.length];

    planData[i].tasks.push({
      text:task,
      done:false
    });

  }


  /*
    إذا الأيام أكثر من عدد المراحل
    نضيف مراجعات إضافية
  */

  for(let i=templates.length;i<days;i++){

    planData[i].tasks.push({
      text:"مراجعة وتثبيت ما سبق",
      done:false
    });

  }


  savePlan();
  renderPlan();


  const message =
    document.getElementById("message");

  message.style.display="block";

  message.innerText =
    `تم إنشاء خطة ${subject} لمدة ${days} أيام ✨`;

}


/* عرض الخطة */

function renderPlan(){

  const plan =
    document.getElementById("plan");


  if(planData.length===0){

    plan.innerHTML =
      '<div class="empty">اختاري المادة وعدد الأيام، ووَتيرة ترتبها لك 💙</div>';

    updateProgress();

    return;
  }


  let html="";


  planData.forEach((day,dayIndex)=>{

    html+=`
      <div class="day">

        <div class="day-title">
          اليوم ${day.day}
        </div>
    `;


    day.tasks.forEach((task,taskIndex)=>{

      html+=`
        <div class="task ${task.done ? "done":""}">

          <input
            type="checkbox"
            ${task.done ? "checked":""}
            onchange="toggleTask(${dayIndex},${taskIndex})"
          >

          <span>${task.text}</span>

        </div>
      `;

    });


    html+=`</div>`;

  });


  plan.innerHTML=html;

  updateProgress();

}


/* تحديد المهمة كمكتملة */

function toggleTask(dayIndex,taskIndex){

  planData[dayIndex].tasks[taskIndex].done =
    !planData[dayIndex].tasks[taskIndex].done;

  savePlan();
  renderPlan();

}


/* إعادة الجدولة */

function lateDay(){

  if(planData.length===0){

    alert("أنشئي خطة أولًا 💙");
    return;
  }


  /*
    نأخذ المهام غير المنجزة
  */

  let remaining=[];

  let completed=[];


  planData.forEach(day=>{

    day.tasks.forEach(task=>{

      if(task.done){
        completed.push(task);
      }else{
        remaining.push(task);
      }

    });

  });


  if(remaining.length===0){

    alert("أنجزتِ كل المهام! 🎉");
    return;
  }


  /*
    نعيد بناء الأيام
  */

  planData.forEach(day=>{
    day.tasks=[];
  });


  /*
    نوزع المهام غير المنجزة
    بالتساوي
  */

  remaining.forEach((task,index)=>{

    const dayIndex =
      index % planData.length;

    planData[dayIndex].tasks.push(task);

  });


  /*
    نحافظ على المهام المنجزة
  */

  if(completed.length>0){

    completed.forEach(task=>{

      planData[0].tasks.unshift(task);

    });

  }


  savePlan();
  renderPlan();


  const message =
    document.getElementById("message");

  message.style.display="block";

  message.innerText =
    "🔄 تمّت إعادة جدولة المهام غير المنجزة تلقائيًا.";

}


/* حفظ الخطة */

function savePlan(){

  localStorage.setItem(
    "wateeraPlan",
    JSON.stringify(planData)
  );

}


/* حذف الخطة */

function clearPlan(){

  if(planData.length===0) return;


  const confirmDelete =
    confirm("هل تريدين حذف الخطة؟");


  if(!confirmDelete) return;


  planData=[];

  localStorage.removeItem("wateeraPlan");

  document.getElementById("message").style.display="none";

  renderPlan();

}


/* حساب التقدم */

function updateProgress(){

  let total=0;
  let completed=0;


  planData.forEach(day=>{

    day.tasks.forEach(task=>{

      total++;

      if(task.done){
        completed++;
      }

    });

  });


  if(total===0){

    document.getElementById("progressText").innerText =
      "لا توجد خطة حاليًا.";

    document.getElementById("progressBar").style.width =
      "0%";

    return;
  }


  const percentage =
    Math.round((completed/total)*100);


  document.getElementById("progressText").innerText =
    `أنجزتِ ${completed} من ${total} مهمة — ${percentage}% 🎉`;

  document.getElementById("progressBar").style.width =
    percentage+"%";

}


/* المؤقت */

function updateTimer(){

  const minutes =
    Math.floor(timerSeconds/60);

  const seconds =
    timerSeconds%60;


  document.getElementById("timer").innerText =
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0");


  if(timerSeconds<=0){

    clearInterval(timerInterval);

    timerInterval=null;

    alert("خلص وقت المذاكرة! خذي استراحة قصيرة 💙");

  }

}


function startTimer(){

  if(timerInterval) return;


  timerInterval=setInterval(()=>{

    if(timerSeconds>0){

      timerSeconds--;

      updateTimer();

    }

  },1000);

}


function pauseTimer(){

  clearInterval(timerInterval);

  timerInterval=null;

}


function resetTimer(){

  clearInterval(timerInterval);

  timerInterval=null;

  timerSeconds=25*60;

  updateTimer();

}


/* تحميل الخطة المحفوظة */

renderPlan();
updateTimer();

</script>

</body>
</html>
