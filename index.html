<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>وَتيرة</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #eef8ff;
  color: #17324d;
}

header {
  background: linear-gradient(135deg, #55b9f3, #8ed8ff);
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 40px;
}

header p {
  margin: 8px 0 0;
  font-size: 16px;
}

.container {
  max-width: 800px;
  margin: 25px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-weight: bold;
}

select,
input[type="text"],
input[type="number"] {
  width: 100%;
  padding: 13px;
  border: 2px solid #d7edf9;
  border-radius: 12px;
  font-size: 16px;
  background: white;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 18px;
  cursor: pointer;
  font-size: 16px;
  margin-top: 12px;
}

.primary {
  background: #55b9f3;
  color: white;
  width: 100%;
}

.secondary {
  background: #e7f6ff;
  color: #1976a8;
}

.danger {
  background: #ffe7e7;
  color: #c0392b;
}

.hidden {
  display: none;
}

.message {
  background: #eef9ff;
  border-radius: 12px;
  padding: 13px;
  margin-top: 15px;
  text-align: center;
}

.day {
  border: 2px solid #e0f2fc;
  border-radius: 16px;
  padding: 15px;
  margin-top: 15px;
}

.day h3 {
  margin-top: 0;
  color: #2388bd;
}

.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px;
  background: #f7fcff;
  border-radius: 10px;
  margin: 8px 0;
}

.task input {
  width: 20px;
  height: 20px;
}

.done {
  text-decoration: line-through;
  opacity: 0.5;
}

.progress-container {
  background: #e5f4fc;
  border-radius: 20px;
  overflow: hidden;
  height: 18px;
  margin-top: 12px;
}

.progress {
  background: #55b9f3;
  height: 100%;
  width: 0%;
  transition: 0.3s;
}

.timer {
  text-align: center;
}

.timer-number {
  font-size: 55px;
  font-weight: bold;
  color: #2388bd;
  margin: 10px;
}

.info-box {
  background: #f5fbff;
  border-radius: 14px;
  padding: 14px;
  margin-top: 15px;
  line-height: 1.7;
}

</style>
</head>


<body>

<header>

  <h1>وَتيرة📝 </h1>

  <p>
    خطتك الدراسية تتنظم معك، حتى عند التأخر.
  </p>

</header>


<div class="container">


<!-- إنشاء الخطة -->

<div class="card">

  <h2>✨ أنشئ خطتك</h2>

  <label>اختر المادة</label>

  <select id="subject" onchange="checkOtherSubject()">

    <option value="">
      اختر المادة
    </option>

    <option value="رياضيات">
      رياضيات
    </option>

    <option value="كيمياء">
      كيمياء
    </option>

    <option value="فيزياء">
      فيزياء
    </option>

    <option value="أحياء">
      أحياء
    </option>

    <option value="قدرات">
      قدرات
    </option>

    <option value="تحصيلي">
      تحصيلي
    </option>

    <option value="other">
      مادة أخرى
    </option>

  </select>


  <!-- مادة أخرى -->

  <div id="otherSubjectBox" class="hidden">

    <label>
      اكتب اسم المادة
    </label>

    <input
      type="text"
      id="otherSubject"
      placeholder="مثال: لغتي"
    >

  </div>


  <label>
    عدد أيام الخطة
  </label>

  <input
    type="number"
    id="days"
    min="1"
    max="30"
    placeholder="مثال: 7"
  >


  <button
    class="primary"
    onclick="createPlan()"
  >
    ✨ أنشئ الخطة
  </button>


  <div id="message"></div>

</div>



<!-- الخطة -->

<div class="card">

  <h2>
    📚 خطتي الدراسية
  </h2>


  <div id="plan"></div>


  <!-- اختيار اليوم الحالي -->

  <div id="currentDayBox" class="hidden">

    <label>
      اليوم الحالي
    </label>

    <select
      id="currentDay"
      onchange="changeCurrentDay()"
    ></select>


    <div class="info-box">

      إذا تأخرت في مهام هذا اليوم،
      سيتم نقل المهام غير المكتملة إلى الأيام التالية
      مع الحفاظ على بقية الخطة.

    </div>


    <button
      class="secondary"
      onclick="lateDay()"
    >
      🔄 تأخرت اليوم

    </button>

  </div>


  <button
    class="danger"
    onclick="clearPlan()"
  >
    🗑️ حذف الخطة
  </button>


  <br><br>


  <strong>
    نسبة الإنجاز
  </strong>


  <div class="progress-container">

    <div
      class="progress"
      id="progress"
    ></div>

  </div>


  <p id="progressText">
    0%
  </p>

</div>



<!-- المؤقت -->

<div class="card timer">

  <h2>
    ⏱️ مؤقت المذاكرة
  </h2>


  <div
    class="timer-number"
    id="timer"
  >
    25:00
  </div>


  <button
    class="primary"
    onclick="startTimer()"
  >
    ▶️ ابدأ
  </button>


  <button
    class="secondary"
    onclick="pauseTimer()"
  >
    ⏸️ إيقاف
  </button>


  <button
    class="danger"
    onclick="resetTimer()"
  >
    🔄 إعادة
  </button>

</div>


</div>



<script>


/* =========================
   المهام الأساسية
========================= */

const taskTemplates = {

  "رياضيات": [
    "فهم الدرس",
    "مراجعة القوانين",
    "حل أمثلة الدرس",
    "حل تمارين متنوعة",
    "مراجعة الأخطاء",
    "اختبار قصير"
  ],

  "كيمياء": [
    "قراءة الدرس وفهم المفاهيم",
    "مراجعة المصطلحات والقوانين",
    "حل الأمثلة",
    "حل أسئلة نهاية الدرس",
    "مراجعة النقاط الصعبة",
    "اختبار قصير"
  ],

  "فيزياء": [
    "فهم المفاهيم الأساسية",
    "مراجعة القوانين والوحدات",
    "حل الأمثلة",
    "حل مسائل متنوعة",
    "مراجعة الأخطاء",
    "اختبار قصير"
  ],

  "أحياء": [
    "قراءة الدرس وفهمه",
    "مراجعة المصطلحات",
    "تلخيص الأفكار الأساسية",
    "مراجعة الرسومات والمفاهيم",
    "حل الأسئلة",
    "اختبار قصير"
  ],

  "قدرات": [
    "مراجعة المهارات الأساسية",
    "تدريب كمي",
    "تدريب لفظي",
    "حل مجموعة أسئلة",
    "مراجعة الأخطاء",
    "تدريب زمني"
  ],

  "تحصيلي": [
    "مراجعة المفاهيم",
    "تدريب على الأسئلة",
    "مراجعة القوانين",
    "حل أسئلة متنوعة",
    "مراجعة الأخطاء",
    "اختبار تجريبي"
  ],

  "default": [
    "قراءة الدرس وفهمه",
    "تحديد الأفكار المهمة",
    "مراجعة المعلومات",
    "حل التدريبات",
    "مراجعة الأخطاء",
    "مراجعة نهائية"
  ]

};



/* =========================
   تحميل الخطة المحفوظة
========================= */

let plan =
  JSON.parse(
    localStorage.getItem("wateeraPlan")
  ) || null;


let currentDay =
  Number(
    localStorage.getItem("wateeraCurrentDay")
  ) || 1;



/* =========================
   إظهار مادة أخرى
========================= */

function checkOtherSubject() {

  const subject =
    document.getElementById("subject").value;

  const box =
    document.getElementById("otherSubjectBox");


  if (subject === "other") {

    box.classList.remove("hidden");

  } else {

    box.classList.add("hidden");

  }

}



/* =========================
   إنشاء الخطة
========================= */

function createPlan() {

  let subject =
    document.getElementById("subject").value;

  const days =
    Number(
      document.getElementById("days").value
    );


  if (!subject) {

    showMessage(
      "اختر المادة أولًا 💙"
    );

    return;
  }


  /* مادة أخرى */

  if (subject === "other") {

    subject =
      document
      .getElementById("otherSubject")
      .value
      .trim();


    if (!subject) {

      showMessage(
        "اكتب اسم المادة 💙"
      );

      return;
    }

  }


  if (!days || days < 1) {

    showMessage(
      "اكتب عدد أيام الخطة 💙"
    );

    return;
  }



  const tasks =
    taskTemplates[subject]
    || taskTemplates["default"];


  plan = {

    subject: subject,

    days: []

  };



  /*
    توزيع المهام على الأيام
  */

  for (
    let i = 0;
    i < days;
    i++
  ) {

    plan.days.push({

      day: i + 1,

      tasks: [

        {

          text:
            tasks[
              i % tasks.length
            ],

          done: false

        }

      ]

    });

  }



  currentDay = 1;


  savePlan();

  saveCurrentDay();

  renderPlan();


  showMessage(

    `تم إنشاء خطة مادة <strong>${subject}</strong>
     لمدة <strong>${days}</strong> أيام ✨`

  );

}



/* =========================
   عرض الخطة
========================= */

function renderPlan() {

  const planDiv =
    document.getElementById("plan");


  const currentDayBox =
    document.getElementById("currentDayBox");


  if (!plan) {

    planDiv.innerHTML = `

      <div class="message">

        لا توجد خطة حاليًا.
        أنشئ خطة من الأعلى ✨

      </div>

    `;


    currentDayBox.classList.add("hidden");

    updateProgress();

    return;
  }



  currentDayBox.classList.remove("hidden");



  /*
    إنشاء قائمة الأيام
  */

  const currentDaySelect =
    document.getElementById("currentDay");


  currentDaySelect.innerHTML = "";


  plan.days.forEach(day => {

    const option =
      document.createElement("option");


    option.value = day.day;

    option.textContent =
      `اليوم ${day.day}`;


    if (day.day === currentDay) {

      option.selected = true;

    }


    currentDaySelect.appendChild(option);

  });



  let html = `

    <h3>
      المادة: ${plan.subject}
    </h3>

  `;



  plan.days.forEach(
    (day, dayIndex) => {

      html += `

        <div class="day">

          <h3>
            اليوم ${day.day}
          </h3>

      `;



      if (day.tasks.length === 0) {

        html += `

          <p>
            لا توجد مهام جديدة لهذا اليوم.
          </p>

        `;

      }



      day.tasks.forEach(
        (task, taskIndex) => {

          html += `

            <div class="task">

              <input
                type="checkbox"

                ${
                  task.done
                  ? "checked"
                  : ""
                }

                onchange="
                  toggleTask(
                    ${dayIndex},
                    ${taskIndex}
                  )
                "
              >

              <span
                class="${
                  task.done
                  ? "done"
                  : ""
                }"
              >

                ${task.text}

              </span>

            </div>

          `;

        }

      );


      html += `</div>`;

    }

  );



  planDiv.innerHTML = html;


  updateProgress();

}



/* =========================
   تغيير اليوم الحالي
========================= */

function changeCurrentDay() {

  currentDay =
    Number(
      document.getElementById("currentDay").value
    );


  saveCurrentDay();

}



/* =========================
   تحديد المهمة كمكتملة
========================= */

function toggleTask(
  dayIndex,
  taskIndex
) {

  plan
    .days[dayIndex]
    .tasks[taskIndex]
    .done =

    !plan
      .days[dayIndex]
      .tasks[taskIndex]
      .done;


  savePlan();

  renderPlan();

}



/* =========================
   إعادة جدولة اليوم المتأخر
========================= */

function lateDay() {

  if (!plan) {

    showMessage(
      "أنشئ خطة أولًا 💙"
    );

    return;
  }



  /*
    الحصول على اليوم المحدد
  */

  const dayIndex =
    currentDay - 1;


  const today =
    plan.days[dayIndex];



  if (!today) {

    showMessage(
      "اختر يومًا صحيحًا 💙"
    );

    return;
  }



  /*
    أخذ المهام غير المكتملة
    من هذا اليوم فقط
  */

  const unfinished =
    today.tasks.filter(
      task => !task.done
    );



  if (unfinished.length === 0) {

    showMessage(
      "جميع مهام هذا اليوم مكتملة 🎉"
    );

    return;
  }



  /*
    نحافظ على المهام المكتملة
  */

  today.tasks =
    today.tasks.filter(
      task => task.done
    );



  /*
    نوزع المهام المتأخرة
    على الأيام التالية فقط
  */

  let taskNumber = 0;



  for (
    let i = dayIndex + 1;

    i < plan.days.length &&
    taskNumber < unfinished.length;

    i++
  ) {

    /*
      نضيف المهمة المتأخرة
      إلى بداية مهام اليوم التالي
    */

    plan.days[i].tasks.unshift({

      text:
        unfinished[taskNumber].text,

      done: false

    });


    taskNumber++;

  }



  /*
    إذا لم تعد هناك أيام كافية،
    تضاف المهام إلى آخر يوم
  */

  while (
    taskNumber < unfinished.length
  ) {

    plan.days[
      plan.days.length - 1
    ].tasks.push({

      text:
        unfinished[taskNumber].text,

      done: false

    });


    taskNumber++;

  }



  savePlan();

  renderPlan();



  showMessage(

    `تمت إعادة جدولة مهام اليوم ${currentDay}
     فقط 🔄✨`

  );

}



/* =========================
   حفظ الخطة
========================= */

function savePlan() {

  localStorage.setItem(

    "wateeraPlan",

    JSON.stringify(plan)

  );

}



/* =========================
   حفظ اليوم الحالي
========================= */

function saveCurrentDay() {

  localStorage.setItem(

    "wateeraCurrentDay",

    currentDay

  );

}



/* =========================
   حذف الخطة
========================= */

function clearPlan() {

  const confirmed =
    confirm(
      "هل تريد حذف الخطة؟"
    );


  if (!confirmed) return;


  plan = null;

  currentDay = 1;


  localStorage.removeItem(
    "wateeraPlan"
  );


  localStorage.removeItem(
    "wateeraCurrentDay"
  );


  renderPlan();


  showMessage(
    "تم حذف الخطة 🗑️"
  );

}



/* =========================
   نسبة الإنجاز
========================= */

function updateProgress() {

  if (!plan) {

    document
      .getElementById("progress")
      .style.width = "0%";


    document
      .getElementById("progressText")
      .innerText = "0%";


    return;
  }



  let total = 0;

  let completed = 0;



  plan.days.forEach(
    day => {

      day.tasks.forEach(
        task => {

          total++;


          if (task.done) {

            completed++;

          }

        }

      );

    }

  );



  const percent =
    total === 0
    ? 0
    : Math.round(
        (completed / total) * 100
      );



  document
    .getElementById("progress")
    .style.width =
    percent + "%";


  document
    .getElementById("progressText")
    .innerText =
    percent + "%";

}



/* =========================
   الرسائل
========================= */

function showMessage(text) {

  document
    .getElementById("message")
    .innerHTML =

    `<div class="message">
      ${text}
    </div>`;

}



/* =========================
   المؤقت
========================= */

let timerSeconds =
  25 * 60;

let timerInterval =
  null;



function updateTimerDisplay() {

  const minutes =
    Math.floor(
      timerSeconds / 60
    );


  const seconds =
    timerSeconds % 60;


  document
    .getElementById("timer")
    .innerText =

    String(minutes)
      .padStart(2, "0")

    + ":" +

    String(seconds)
      .padStart(2, "0");

}



function startTimer() {

  if (timerInterval) return;


  timerInterval =
    setInterval(

      () => {

        if (timerSeconds > 0) {

          timerSeconds--;

          updateTimerDisplay();

        }

        else {

          clearInterval(
            timerInterval
          );

          timerInterval = null;


          alert(
            "انتهى وقت المذاكرة! 🎉"
          );

        }

      },

      1000

    );

}



function pauseTimer() {

  clearInterval(
    timerInterval
  );

  timerInterval = null;

}



function resetTimer() {

  clearInterval(
    timerInterval
  );

  timerInterval = null;


  timerSeconds =
    25 * 60;


  updateTimerDisplay();

}



/* =========================
   تشغيل الموقع
========================= */

renderPlan();

updateTimerDisplay();

</script>

</body>
</html>
